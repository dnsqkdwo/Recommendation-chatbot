# 키 이름 목록만 담은 예시. 값은 넣지 않음
# 실제 Secret은 .env에서 만듦: kubectl create secret generic recommendation-chatbot --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: recommendation-chatbot
type: Opaque
stringData:
  DATA_GO_KR_SERVICE_KEY: ""
  KOBIS_API_KEY: ""
  KMDB_API_KEY: ""
  KOPIS_SERVICE_KEY: ""
  SEOUL_OPENAPI_KEY: ""
  NL_API_KEY: ""
  DATA4LIBRARY_AUTH_KEY: ""
  OPENROUTER_API_KEY: ""
  MATTERMOST_WEBHOOK_URL: ""
  MATTERMOST_ADMIN_WEBHOOK_URL: ""
  HOLIDAY_API_URL: ""
  # 선택. 있으면 config.ts 모델 상수 대신 사용
  # LLM_MODEL: ""
  # LLM_FALLBACK_MODEL: ""
